services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_DEFAULT_USERNAME}
      POSTGRES_PASSWORD: ${DB_DEFAULT_PASSWORD}
      POSTGRES_DB: ${DB_DEFAULT_DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_DEFAULT_USERNAME} -d ${DB_DEFAULT_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    # ES 7.17 — последняя версия без требования AVX/AVX2 на хосте;
    # 8.x и 9.x требуют SIMD-расширения, недоступные на некоторых CPU/VM
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    environment:
      discovery.type: single-node             # Один узел — без кластера и реплик
      ELASTIC_PASSWORD: ${ES_SUPERUSER_PASSWORD}        # Пароль встроенного пользователя elastic
      xpack.security.enabled: "true"          # Базовая аутентификация включена
      xpack.security.http.ssl.enabled: "false" # HTTP без TLS (только для разработки)
      xpack.license.self_generated.type: basic # Базовая лицензия, без пробных возможностей
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"       # Ограничение heap для dev-окружения
      action.destructive_requires_name: "false" # Разрешить удаление индексов по wildcard без предупреждений
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ES_SUPERUSER_PASSWORD} http://localhost:9200/_cluster/health | grep -q green"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.32.6
    cpus: 2
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_cache:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 5s
      timeout: 3s
      retries: 10

  # дополнительный one-shot сервис для загрузки модели
  ollama-pull:
    image: ollama/ollama:0.32.6
    environment:
      OLLAMA_HOST: ollama:11434
    command: pull ${OLLAMA_MODEL}
    volumes:
      - ollama_cache:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Загружаем весь .env из корня проекта, затем переопределяем
    # хосты и порты БД и Эластика
    env_file: .env
    environment:
      BACKEND_HOST: "0.0.0.0"
      DB_HOST: "db"
      DB_PORT: "5432"
      ES_HOST: "elasticsearch"
      ES_PORT: "9200"
      OLLAMA_HOST: "ollama"
      OLLAMA_PORT: "11434"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  pgdata:
  esdata:
  ollama_cache:
